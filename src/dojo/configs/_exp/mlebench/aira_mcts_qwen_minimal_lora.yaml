# @package _global_
defaults:
  - override /benchmark: mlebench/dev
  - override /interpreter: jupyter
  - override /solver: mlebench/mcts
  - override /solver/memory: no_memory
  - override /solver/client@solver.operators.analyze.llm.client: litellm_qwen3.5-9B-mle-lora
  - override /solver/client@solver.operators.debug.llm.client: litellm_qwen3.5-9B-mle-lora
  - override /solver/client@solver.operators.draft.llm.client: litellm_qwen3.5-9B-mle-lora
  - override /solver/client@solver.operators.improve.llm.client: litellm_qwen3.5-9B-mle-lora

solver:
  operators:
    draft:
      llm:
        generation_kwargs:
          allowed_openai_params: ["reasoning_effort"]
          reasoning_effort: minimal
    improve:
      llm:
        generation_kwargs:
          allowed_openai_params: ["reasoning_effort"]
          reasoning_effort: minimal
    debug:
      llm:
        generation_kwargs:
          allowed_openai_params: ["reasoning_effort"]
          reasoning_effort: minimal
    analyze:
      llm:
        generation_kwargs:
          allowed_openai_params: ["reasoning_effort"]
          reasoning_effort: minimal

metadata:
  git_issue_id: to_be_determined

vars:
  metadata.seed: [1,2,3,4,5,6,7,8]