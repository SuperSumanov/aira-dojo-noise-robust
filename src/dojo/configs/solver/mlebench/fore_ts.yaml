defaults:
  - fore_ts
  - /solver/operators@operators:
    - mlebench/aira_operators/debug
    - mlebench/aira_operators/draft
    - mlebench/aira_operators/improve
    - mlebench/aide_operators/analyze
  - override memory: simple_memory
  - override memory@debug_memory: debug_memory

_target_: dojo.config_dataclasses.solver.fore_ts.ForeTSSolverConfig

export_search_results: true

step_limit: 10000
num_children: 5
uct_c: 0.25
max_debug_depth: 20
data_preview: true
max_debug_time: 1e9

critic_host: "127.0.0.1"
critic_port: 8765
critic_max_attempts: 5
critic_top_k: 4
num_children_to_choose: 2

use_test_score: false
use_complexity: false

operators:
  draft:
    llm:
      generation_kwargs:
        temperature: 0.6
        top_p: 0.95
  improve:
    llm:
      generation_kwargs:
        temperature: 0.6
        top_p: 0.95
  debug:
    llm:
      generation_kwargs:
        temperature: 0.6
        top_p: 0.95
  analyze:
    llm:
      generation_kwargs:
        temperature: 0.5
