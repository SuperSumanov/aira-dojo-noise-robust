defaults:
  - mcts
  - /solver/operators@operators:
    - mlebench/aira_operators/debug
    - mlebench/aira_operators/draft
    - mlebench/aira_operators/improve
    - mlebench/warmup_operators/analyze
  - override memory: simple_memory
  - override memory@debug_memory: debug_memory
  - override /solver/client@operators.draft.llm.client: litellm_minimax-m3.1-flash
  - override /solver/client@operators.debug.llm.client: litellm_minimax-m3.1-flash
  - override /solver/client@operators.improve.llm.client: litellm_minimax-m3.1-flash

_convert_: object
_target_: dojo.config_dataclasses.solver.mcts.MCTSSolverConfig

export_search_results: true
step_limit: 10000
num_children: 5
uct_c: 0.25
max_debug_depth: 20
data_preview: true
max_debug_time: 1e9
use_test_score: false
use_complexity: false

operators:
  draft:
    llm:
      generation_kwargs:
        temperature: 0.6
        top_p: 0.95
  improve:
    llm:
      generation_kwargs:
        temperature: 0.6
        top_p: 0.95
  debug:
    llm:
      generation_kwargs:
        temperature: 0.6
        top_p: 0.95
  analyze:
    llm:
      generation_kwargs:
        temperature: 0.5
