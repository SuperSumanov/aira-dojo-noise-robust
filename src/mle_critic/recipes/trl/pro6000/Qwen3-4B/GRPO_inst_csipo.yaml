# Model arguments
model_name_or_path: Qwen/Qwen3-4B
model_revision: main
dtype: bfloat16
attn_implementation: flash_attention_2

# Training data arguments
dataset_name: data/augmented_mle_critic/mlejudger_easy

# Algorithm arguments
loss_type: "cispo"
epsilon_high: 5.0
dynamic_sampling_scale: 1
#overlong_punishment_threshold: 0.75

# reward config
reward_funcs: ['accuracy']
reward_weights: [1.0]

# vllm config
vllm_mode: colocate
vllm_tensor_parallel_size: 1
temperature: 0.7
bf16: true
use_vllm: true
vllm_gpu_memory_utilization: 0.5
max_completion_length: 16384
vllm_enable_sleep_mode: true

# eval config
do_eval: true
eval_strategy: "steps"
eval_steps: 16
num_generations_eval: 1
quick_eval_dataset: data/augmented_mle_critic/mlejudger_easy
quick_eval_dataset_size: 2000

# gradient checkpoint and lr
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
learning_rate: 1e-06
lr_scheduler_type: constant

# Batch config
gradient_accumulation_steps: 64
num_generations: 8
num_iterations: 4 
num_train_epochs: 1
per_device_eval_batch_size: 1000
per_device_train_batch_size: 2

# saving
output_dir: outputs/Qwen3-4B/GRPO-4B-mlejudger-easy-inst-csipo
push_to_hub: False
#save_strategy: "best"
#metric_for_best_model: "rewards/mean"
#greater_is_better: True
#save_only_model: False
save_strategy: "steps"
save_steps: 128
save_total_limit: 1

# logging
report_to:
- wandb
log_completions: True
log_level: info
logging_steps: 1
logging_strategy: steps
seed: 42
silence: true
num_completions_to_print: 4

# liger kernel
use_liger_kernel: false